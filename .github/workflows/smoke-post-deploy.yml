name: Smoke post-deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROD: https://ombreeluci.it
  STAGING: https://ombreeluci-staging.pages.dev
  CMS: https://cms.ombreeluci.it

jobs:
  smoke:
    name: Smoke test post-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Attesa deploy CF Pages (~3.5 min)
        run: sleep 210

      # ═══════════════════════════════════════════════════════════
      # CRITICI — fallimento = danno reale, azione immediata
      # ═══════════════════════════════════════════════════════════

      - name: "CRITICO — Produzione NO noindex"
        id: noindex_prod
        run: |
          HEADERS=$(curl -sI "$PROD/it/ombre-e-luci/")
          if echo "$HEADERS" | grep -qi "noindex"; then
            echo "::error::NOINDEX SU PRODUZIONE — Google sta de-indicizzando il sito!"
            exit 1
          fi

      - name: "CRITICO — Homepage IT 200"
        id: home_it
        run: |
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" "$PROD/")
          if [ "$HTTP" != "200" ]; then
            echo "::error::Homepage IT non risponde (HTTP $HTTP)"
            exit 1
          fi

      - name: "CRITICO — Articolo SSR IT non broken"
        id: ssr_it
        run: |
          BODY=$(curl -sf "$PROD/it/ombre-e-luci/" || echo "FETCH_FAILED")
          if echo "$BODY" | head -1 | grep -q "object Object"; then
            echo "::error::SSR IT restituisce [object Object] — sito rotto"
            exit 1
          fi
          if ! echo "$BODY" | grep -q '<!DOCTYPE'; then
            echo "::error::SSR IT non restituisce HTML valido"
            exit 1
          fi

      - name: "CRITICO — Articolo SSR EN non broken"
        id: ssr_en
        run: |
          BODY=$(curl -sf "$PROD/en/good-news-for-us-all/" || echo "FETCH_FAILED")
          if echo "$BODY" | head -1 | grep -q "object Object"; then
            echo "::error::SSR EN restituisce [object Object]"
            exit 1
          fi

      - name: "CRITICO — CMS Directus raggiungibile"
        id: cms
        run: |
          BODY=$(curl -sf --max-time 10 "$CMS/server/ping" || echo "FAIL")
          if ! echo "$BODY" | grep -q "pong"; then
            echo "::error::CMS Directus non raggiungibile"
            exit 1
          fi

      - name: "CRITICO — Canonical non punta a staging"
        id: canonical
        run: |
          BODY=$(curl -sf "$PROD/it/ombre-e-luci/")
          if echo "$BODY" | grep -q 'rel="canonical".*staging'; then
            echo "::error::Canonical punta a staging!"
            exit 1
          fi
          if echo "$BODY" | grep -q 'rel="canonical".*pages.dev'; then
            echo "::error::Canonical punta a pages.dev!"
            exit 1
          fi

      - name: "CRITICO — Cache-Control asset immutable"
        id: cache_assets
        run: |
          CSS=$(curl -sf "$PROD/" | grep -oE '/_astro/[^"]+\.css' | head -1)
          if [ -n "$CSS" ]; then
            CC=$(curl -sI "$PROD$CSS" | grep -i "cache-control")
            if ! echo "$CC" | grep -qi "immutable"; then
              echo "::error::CSS senza cache immutable — cache rate crollerà"
              exit 1
            fi
          fi

      # ═══════════════════════════════════════════════════════════
      # IMPORTANTI — fallimento = degrado, da fixare entro 24h
      # ═══════════════════════════════════════════════════════════

      - name: "IMPORTANTE — Staging HA noindex"
        id: noindex_staging
        continue-on-error: true
        run: |
          HEADERS=$(curl -sI "$STAGING/it/ombre-e-luci/")
          if ! echo "$HEADERS" | grep -qi "noindex"; then
            echo "::warning::Staging senza noindex — Google potrebbe indicizzarlo"
            exit 1
          fi

      - name: "IMPORTANTE — Homepage EN 200"
        id: home_en
        continue-on-error: true
        run: |
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" "$PROD/en/")
          [ "$HTTP" = "200" ] || exit 1

      - name: "IMPORTANTE — Sitemap IT valida"
        id: sitemap_it
        continue-on-error: true
        run: |
          BODY=$(curl -sf "$PROD/sitemap.xml")
          echo "$BODY" | grep -q "<loc>" || exit 1

      - name: "IMPORTANTE — Sitemap EN valida"
        id: sitemap_en
        continue-on-error: true
        run: |
          BODY=$(curl -sf "$PROD/sitemap-en.xml")
          echo "$BODY" | grep -q "/en/" || exit 1

      - name: "IMPORTANTE — Redirect legacy funziona"
        id: redirect
        continue-on-error: true
        run: |
          HTTP=$(curl -sI -o /dev/null -w "%{http_code}" "$PROD/2023/ombre-e-luci/")
          [ "$HTTP" = "301" ] || exit 1

      - name: "IMPORTANTE — Archivio IT 200"
        id: archivio
        continue-on-error: true
        run: |
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" "$PROD/it/archivio/")
          [ "$HTTP" = "200" ] || exit 1

      - name: "IMPORTANTE — Numero rivista SSR 200"
        id: numero
        continue-on-error: true
        run: |
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" "$PROD/it/archivio/oel-173/")
          [ "$HTTP" = "200" ] || exit 1

      - name: "IMPORTANTE — hreflang presente su articolo"
        id: hreflang
        continue-on-error: true
        run: |
          BODY=$(curl -sf "$PROD/it/ombre-e-luci/")
          if ! echo "$BODY" | grep -q 'hreflang="en"'; then
            echo "::warning::hreflang EN mancante su articolo IT"
            exit 1
          fi

      - name: "IMPORTANTE — API health endpoint"
        id: api_health
        continue-on-error: true
        run: |
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" "$PROD/api/health")
          [ "$HTTP" = "200" ] || exit 1

      # ═══════════════════════════════════════════════════════════
      # RIEPILOGO
      # ═══════════════════════════════════════════════════════════

      - name: Riepilogo
        if: always()
        run: |
          echo "═══ CRITICI ═══"
          echo "noindex_prod:  ${{ steps.noindex_prod.outcome }}"
          echo "home_it:       ${{ steps.home_it.outcome }}"
          echo "ssr_it:        ${{ steps.ssr_it.outcome }}"
          echo "ssr_en:        ${{ steps.ssr_en.outcome }}"
          echo "cms:           ${{ steps.cms.outcome }}"
          echo "canonical:     ${{ steps.canonical.outcome }}"
          echo "cache_assets:  ${{ steps.cache_assets.outcome }}"
          echo ""
          echo "═══ IMPORTANTI ═══"
          echo "noindex_stag:  ${{ steps.noindex_staging.outcome }}"
          echo "home_en:       ${{ steps.home_en.outcome }}"
          echo "sitemap_it:    ${{ steps.sitemap_it.outcome }}"
          echo "sitemap_en:    ${{ steps.sitemap_en.outcome }}"
          echo "redirect:      ${{ steps.redirect.outcome }}"
          echo "archivio:      ${{ steps.archivio.outcome }}"
          echo "numero:        ${{ steps.numero.outcome }}"
          echo "hreflang:      ${{ steps.hreflang.outcome }}"
          echo "api_health:    ${{ steps.api_health.outcome }}"

      - name: Notifica fallimenti critici
        if: >-
          always() && (
            steps.noindex_prod.outcome == 'failure' ||
            steps.home_it.outcome == 'failure' ||
            steps.ssr_it.outcome == 'failure' ||
            steps.ssr_en.outcome == 'failure' ||
            steps.cms.outcome == 'failure' ||
            steps.canonical.outcome == 'failure' ||
            steps.cache_assets.outcome == 'failure'
          )
        run: |
          FAILURES=""
          [ "${{ steps.noindex_prod.outcome }}" = "failure" ] && FAILURES="$FAILURES 🔴NOINDEX_PROD"
          [ "${{ steps.home_it.outcome }}" = "failure" ] && FAILURES="$FAILURES 🔴HOME_DOWN"
          [ "${{ steps.ssr_it.outcome }}" = "failure" ] && FAILURES="$FAILURES 🔴SSR_IT_BROKEN"
          [ "${{ steps.ssr_en.outcome }}" = "failure" ] && FAILURES="$FAILURES 🔴SSR_EN_BROKEN"
          [ "${{ steps.cms.outcome }}" = "failure" ] && FAILURES="$FAILURES 🔴CMS_DOWN"
          [ "${{ steps.canonical.outcome }}" = "failure" ] && FAILURES="$FAILURES 🔴CANONICAL_WRONG"
          [ "${{ steps.cache_assets.outcome }}" = "failure" ] && FAILURES="$FAILURES 🟡CACHE_BROKEN"
          echo "::error::SMOKE TEST FALLITO:$FAILURES"
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              -d "{\"text\":\"🚨 *OEL SMOKE CRITICO*\n$FAILURES\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
          fi
