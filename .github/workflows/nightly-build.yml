name: Nightly rebuild

on:
  schedule:
    # Ogni notte alle 02:00 UTC (04:00 ora italiana estiva)
    - cron: '0 2 * * *'
  workflow_dispatch: # trigger manuale dal pannello GitHub Actions

jobs:
  check-directus:
    name: Verifica Directus raggiungibile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      directus_ok: ${{ steps.health.outputs.ok }}
    steps:
      - name: Health check Directus
        id: health
        run: |
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
            "https://cms.ombreeluci.it/server/ping" || echo "000")
          echo "Directus HTTP status: $HTTP"
          if [ "$HTTP" = "200" ]; then
            echo "ok=true" >> $GITHUB_OUTPUT
          else
            echo "ok=false" >> $GITHUB_OUTPUT
            echo "::warning::Directus non raggiungibile (HTTP $HTTP) — build userà snapshot"
          fi

  trigger-build:
    name: Trigger Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: check-directus
    steps:
      - name: Trigger Cloudflare Pages deployment (Deploy Hook)
        id: deploy
        run: |
          if [ -z "${{ secrets.CF_DEPLOY_HOOK }}" ]; then
            echo "::error::Secret CF_DEPLOY_HOOK mancante"
            exit 1
          fi
          HTTP=$(curl -s -o /tmp/hook_body.txt -w "%{http_code}" \
            -X POST "${{ secrets.CF_DEPLOY_HOOK }}")
          echo "Deploy hook HTTP: $HTTP"
          echo "Body:"; cat /tmp/hook_body.txt || true
          if [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 300 ]; then
            echo "::error::Deploy hook fallito (HTTP $HTTP)"
            exit 1
          fi

      - name: Notifica fallimento
        if: failure()
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              -d "{\"text\":\"⚠️ *OEL nightly build fallita*\nDirectus ok: ${{ needs.check-directus.outputs.directus_ok }}\nDettagli: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
          fi
