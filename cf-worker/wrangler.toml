name = "ombreeluci-redirects"
main = "redirect-worker.js"
compatibility_date = "2024-01-01"

routes = [
  # Intercetta tutto il traffico sul dominio: il DNS punta ancora ad Aruba, quindi
  # senza questo route gli utenti vedrebbero WordPress. Qui: redirect legacy, proxy WP,
  # poi forward esplicito verso Cloudflare Pages (mai fetch(request) verso origin Aruba).
  { pattern = "ombreeluci.it/*", zone_name = "ombreeluci.it" },
]

# Origine del sito Astro (Pages). In produzione punta al progetto che servi davvero.
[vars]
PAGES_ORIGIN = "https://ombreeluci-staging.pages.dev"

# /api/revalidate + purge: gestiti da Astro (env su CF Pages). Questo Worker non richiede più
# REVALIDATE_SECRET / CF_ZONE_ID / CF_PURGE_TOKEN salvo tu non voglia duplicare la logica qui.
