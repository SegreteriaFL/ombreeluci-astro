name = "ombreeluci-redirects"
main = "redirect-worker.js"
compatibility_date = "2024-01-01"

routes = [
  { pattern = "ombreeluci.it/wp-admin*", zone_name = "ombreeluci.it" },
  { pattern = "ombreeluci.it/wp-login.php", zone_name = "ombreeluci.it" },
  { pattern = "ombreeluci.it/wp-cron.php", zone_name = "ombreeluci.it" },
  { pattern = "ombreeluci.it/wp-content*", zone_name = "ombreeluci.it" },
]

# Il Worker intercetta SOLO i path WordPress (proxy verso Aruba IP).
# Redirect SEO e /api/revalidate sono gestiti da Astro middleware/API route
# nel _worker.js di Pages, eliminando ogni conflitto di contesto.

# Secrets (NON mettere valori reali qui — impostare con: wrangler secret put NOME)
# REVALIDATE_SECRET  — secret condiviso con Directus (genera con: openssl rand -hex 32)
# CF_ZONE_ID         — Zone ID del dominio ombreeluci.it (CF Dashboard → Overview)
# CF_PURGE_TOKEN     — CF API Token con permesso "Cache Purge" su ombreeluci.it
